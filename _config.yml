twitter: ""

# Top menu buttons, in order. Add or remove entries freely.
# Optional hand-drawn icon: save your drawing in assets/img/icons/
# (transparent PNG or SVG) and add a line under the button, e.g.
#     icon: /assets/img/icons/art.png
nav:
  - title: Home
    url: /
  - title: Projects
    url: /projects/
  - title: Blog
    url: /blog/
  - title: Art
    url: /art/
  - title: CV
    url: /cv/

# Images
avatar: /assets/img/me.jpeg
favicon: /assets/img/favicon.png
favicon_dark: /assets/img/favicon-dark.png

# Appearance
enable_footnote: false   # "Powered by Jekyll and Minimal Light" line
auto_dark_mode: true     # follow the visitor's light/dark system setting
font: "Serif"            # or "Sans Serif"

# ── Technical settings (rarely need changing) ────────────────
lang: en
timezone: Europe/Zurich
markdown: kramdown
permalink: /blog/:year/:title/

plugins:
  - jekyll-feed

feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
