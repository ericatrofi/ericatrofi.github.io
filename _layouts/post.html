---
layout: default
---
<article class="post">
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
  <h2 class="post-title">{{ page.title }}</h2>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    {% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}
  </p>

  {{ content }}

  <hr>
  <p class="post-nav">
    {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>{% endif %}
    {% if page.next %}<a class="post-nav-next" href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>{% endif %}
  </p>
</article>
