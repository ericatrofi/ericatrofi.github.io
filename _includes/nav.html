<!-- Top menu. The buttons are listed in _config.yml under "nav". -->
<nav class="topnav" aria-label="Main">
  {% for item in site.nav %}
    {% assign active = false %}
    {% if item.url == "/" %}
      {% if page.url == "/" or page.url == "/index.html" %}{% assign active = true %}{% endif %}
    {% elsif page.url contains item.url %}
      {% assign active = true %}
    {% endif %}
    <a href="{{ item.url | relative_url }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
  {% endfor %}
</nav>
